[package]
name = "solitaire"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An original offline collection of classic patience games for Omarchy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"

[build-dependencies]
slint-build = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = "warn"
pedantic = "warn"

